# Input query cost budget: max 30 (Shopify, docs: leaf 1, metafield 3, metaobject 1,
# metaobject field(key:) 3, containers/__typename/metafield value 0).
# Stage 1 = 21. Stage 2 adds token value 1 + variant id 1 + keys metafield 3 + date 1
# + pastFresh 1 = 28; + buyerIdentity.customer.id 1 (draft-invoice exemption) = 29 / 30 (subtotal replaced total, same cost).
#
# $freshUntil comes from the function's input-variables metafield ($app:sc.vars on the checkout
# rule), rewritten by the token server on every key publish. The default makes a missing
# metafield count as stale -> token check fails open (D5).
query Input($freshUntil: DateTimeWithoutTimezone = "2000-01-01T00:00:00") {
  buyerJourney {
    step
  }
  cart {
    token: attribute(key: "_bg") {
      value
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
    buyerIdentity {
      email
      isAuthenticated
      customer {
        id
      }
      purchasingCompany {
        company {
          id
        }
      }
    }
    deliveryGroups {
      deliveryAddress {
        firstName
        lastName
        name
        address1
        zip
        countryCode
      }
    }
  }
  # Signing keys live on the checkout rule (validation) itself, not on the shop: shop metafields
  # in $app namespaces are readable from theme Liquid (dev test T9), validation metafields are not.
  validation {
    keys: metafield(namespace: "$app:sc", key: "keys") {
      value
    }
  }
  shop {
    localTime {
      date
      pastFresh: dateTimeAfter(dateTime: $freshUntil)
    }
    settings: metaobject(handle: { type: "$app:bot_gate_settings", handle: "settings" }) {
      enabled: field(key: "enabled") {
        value
      }
      config: field(key: "config") {
        value
      }
    }
  }
}
