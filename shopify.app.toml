# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Medicalrite Bot Gate"
client_id = "95ea1c81ef6561574915f99863674d71"
# Stage 2: app home + app proxy are served by the dev token server (Cloudflare Worker "sc-dev").
# Dev token server (Cloudflare Worker sc-dev), deployed from server/.
application_url = "https://sc-dev.hexondigitaldev.workers.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_products,read_payment_customizations,write_payment_customizations,read_validations,write_validations"

[build]
# false: `shopify app dev` must not replace the Worker URLs with a tunnel.
automatically_update_urls_on_dev = false

[auth]
redirect_urls = [ "https://sc-dev.hexondigitaldev.workers.dev/" ]

# Token endpoint on the storefront: /apps/sc/t  ->  https://sc-dev.hexondigitaldev.workers.dev/proxy/t
[app_proxy]
url = "https://sc-dev.hexondigitaldev.workers.dev/proxy"
subpath = "sc"
prefix = "apps"

[webhooks]
api_version = "2026-10"

# Stage 1 settings, editable by store staff in Shopify admin > Content > Metaobjects.
# The checkout rule reads the entry with handle "settings" (was "main" until Stage 2). Only TWO fields on purpose:
# Shopify caps a function's input query cost at 30 and each metaobject field costs 4.
[metaobjects.app.bot_gate_settings]
name = "Bot Gate settings"
description = "Checkout rules and token settings. Create ONE entry with handle 'settings'. Changes apply within minutes, no redeploy."
access.admin = "merchant_read_write"

[metaobjects.app.bot_gate_settings.fields.enabled]
name = "Enabled"
description = "Kill switch. False = every checkout goes through."
type = "boolean"
required = true

[metaobjects.app.bot_gate_settings.fields.config]
name = "Rules (JSON)"
description = "Rules as JSON: mode, token_mode, blocklists, support_phone. See docs/settings.md."
type = "json"
